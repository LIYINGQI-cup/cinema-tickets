<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile · Cinema.Tickets</title>
  <link rel="stylesheet" href="./kit/tokens.css">
  <link rel="stylesheet" href="./kit/base.css">
  <link rel="stylesheet" href="./kit/layout.css">
  <link rel="stylesheet" href="./kit/components.css">
</head>
<body>
  <div class="l-page">
    <header class="l-header">
      <div class="l-container c-header">
        <a class="c-header__logo" href="index.html">
          <svg class="c-icon c-icon--lg" aria-hidden="true"><use href="./kit/icons.svg#icon-logo"></use></svg>
          <span>Cinema.Tickets</span>
        </a>
        <nav class="c-nav" aria-label="Main">
          <a class="c-nav__link" href="index.html" data-page="movies">Movies</a>
          <a class="c-nav__link" href="bookings.html" data-page="bookings">Bookings</a>
          <a class="c-nav__link" href="cart.html" data-page="cart">Cart <span class="c-counter" hidden>0</span></a>
        </nav>
        <div class="c-header__user"></div>
      </div>
    </header>

    <main class="l-main">
      <div class="l-container l-stack l-stack--lg">
        <div class="l-narrow l-narrow--wide">
          <section class="c-card" aria-labelledby="prof-title">
            <div class="c-card__header"><h1 class="c-card__title" id="prof-title">Profile</h1></div>
            
            <form class="c-card__body" id="profile-form" novalidate>
              <div id="profile-error"></div>
              
              <div class="c-static">
                <span class="c-static__label">Email</span>
                <span class="c-static__value" id="prof-email">—</span>
              </div>
              
              <div class="c-static">
                <span class="c-static__label">Gender</span>
                <span class="c-static__value" id="prof-gender">—</span>
              </div>

              <div class="c-field">
                <label class="c-field__label" for="prof-name">Full name</label>
                <input class="c-input" id="prof-name" type="text" name="fullName" autocomplete="name">
                <p class="c-field__error" id="prof-name-error" hidden><svg class="c-icon c-icon--sm" aria-hidden="true"><use href="./kit/icons.svg#icon-error"></use></svg><span></span></p>
              </div>

              <div class="c-field">
                <label class="c-field__label" for="prof-birth">Date of birth</label>
                <input class="c-input" id="prof-birth" type="date" name="birthDate" autocomplete="bday">
                <p class="c-field__error" id="prof-birth-error" hidden><svg class="c-icon c-icon--sm" aria-hidden="true"><use href="./kit/icons.svg#icon-error"></use></svg><span></span></p>
              </div>

              <div class="c-field">
                <label class="c-field__label" for="prof-phone">Phone number</label>
                <input class="c-input" id="prof-phone" type="tel" name="phoneNumber" autocomplete="tel" placeholder="+7 (___) ___-__-__" aria-describedby="prof-phone-hint">
                <p class="c-field__hint" id="prof-phone-hint">Format: +7 (xxx) xxx-xx-xx.</p>
                <p class="c-field__error" id="prof-phone-error" hidden><svg class="c-icon c-icon--sm" aria-hidden="true"><use href="./kit/icons.svg#icon-error"></use></svg><span></span></p>
              </div>

              <div class="c-form-actions">
                <button class="c-btn c-btn--primary" type="submit" id="prof-submit">Save changes</button>
              </div>
            </form>
          </section>
        </div>
      </div>
    </main>

    <footer class="l-footer">
      <div class="l-container c-footer">© 2026 Cinema.Tickets · Frontend study project</div>
    </footer>
  </div>
  <script type="module" src="./js/pages/profile.js"></script>
</body>
</html>
